<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StillThere</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1d33; --card: #16263f; --line: #2a3d5c; --ink: #eef2f8; --muted: #a9b6c9;
      --calm: #4fd1a1; --different: #f2a93b; --unseen: #9aa7bd; --alexa: #19c3ef;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f6f4ef; --card: #ffffff; --line: #e1dccf; --ink: #1d1a14; --muted: #5c574d;
      --calm: #17865e; --different: #a8640a; --unseen: #6b7385; --alexa: #0a7fa3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
    main { padding: 16px; }
    .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px 18px 24px; overflow: hidden; }
    .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--muted); }
    .tone-normal::before, .tone-routine::before { background: var(--calm); }
    .tone-overdue::before { background: var(--different); }
    .tone-cannot_see::before { background: var(--unseen); }
    .tone-routine::before { background: var(--alexa); }
    .eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .tone-normal .eyebrow { color: var(--calm); }
    .tone-overdue .eyebrow { color: var(--different); }
    .tone-routine .eyebrow { color: var(--alexa); }
    h1 { font-size: 21px; line-height: 1.25; margin: 8px 0 4px; }
    .detail { margin: 0 0 6px; color: var(--muted); }
    .foot { margin: 14px 0 0; font-size: 12px; color: var(--muted); }

    .timeline { list-style: none; margin: 14px 0 0; padding: 0; }
    .row { display: grid; grid-template-columns: 7.5rem 1fr 10rem; gap: 14px; align-items: center; height: 36px; }
    .row .name { font-weight: 600; }
    .row .when { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
    .row.overdue .name, .row.overdue .when { color: var(--different); }
    .track { position: relative; height: 100%; display: block; }
    .track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
    .band { position: absolute; top: 50%; height: 9px; transform: translateY(-50%); border-radius: 9px; background: var(--line); }
    .overdue .band { background: color-mix(in srgb, var(--different) 45%, transparent); }
    .now { position: absolute; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: var(--alexa); }
    .dot { position: absolute; top: 50%; width: 15px; height: 15px; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid var(--muted); background: var(--card); }
    .done .dot { background: var(--calm); border-color: var(--calm); }
    .overdue .dot { border: 3px solid var(--different); }
    .cannot_see .dot { border-style: dashed; }
    .axis { display: grid; grid-template-columns: 7.5rem 1fr 10rem; gap: 14px; height: 34px; }
    .axis .track { grid-column: 2; }
    .axis .track::before { display: none; }
    .tick { position: absolute; top: 6px; transform: translateX(-50%); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .nowpill { position: absolute; top: 4px; transform: translateX(-50%); white-space: nowrap; background: var(--alexa); color: #06121f; font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; }

    .routine { list-style: none; margin: 12px 0 0; padding: 0; }
    .routine li { display: grid; grid-template-columns: 4.5rem 1fr auto; gap: 12px; align-items: center; padding: 5px 0; }
    .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .held { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .meter { width: 5rem; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; display: block; }
    .meter span { display: block; height: 100%; background: var(--calm); }

    blockquote { margin: 10px 0 0; padding-left: 14px; border-left: 2px solid var(--line); font-size: 17px; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 14px; }
    caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 0 0 6px; }
    td { padding: 6px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    .r { text-align: right; }

    .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
    button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 99px; padding: 5px 14px; cursor: pointer; }
    button:hover { border-color: var(--muted); }
    button:focus-visible { outline: 2px solid var(--alexa); outline-offset: 2px; }
    button:disabled { opacity: .5; cursor: progress; }
    .error { color: var(--different); margin: 0 0 8px; }
    @media (max-width: 560px) {
      .row, .axis { grid-template-columns: 5.5rem 1fr; }
      .row .when { display: none; }
      .axis > span:last-child { display: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .card { animation: rise .35s ease-out; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    }
  </style>
</head>
<body>
  <main>
    <div id="root" aria-live="polite"><section class="card"><p class="detail">Asking StillThere…</p></section></div>
    <div class="bar">
      <span>StillThere · answers from the MCP server</span>
      <button id="refresh" type="button">Check again</button>
    </div>
  </main>
  <script type="module">/*__APP_SCRIPT__*/</script>
</body>
</html>
